[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-multi-tool"
version = "0.1.0"
description = "Lightweight Ubuntu GUI launcher for multiple SSH terminal sessions"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.4,<5"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
ssh-multi-tool = "ssh_multi_tool.__main__:main"

[tool.setuptools]
packages = ["ssh_multi_tool"]

[tool.setuptools.data-files]
"share/ssh-multi-tool/examples" = ["examples/rdkx5.json", "examples/smoke-test.json"]
